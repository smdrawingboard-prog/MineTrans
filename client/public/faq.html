<style>
:root{
  --onyx:#0A0A0B; --graphite:#3A383D; --charcoal:#1E1D20; --platinum:#C9CACE;
  --copper:#AD6A3D; --copper-bright:#C9854F; --bone:#F7F5F1;
  --line:rgba(201,202,206,.14); --line-copper:rgba(173,106,61,.35);
  --df:'Playfair Display',serif; --sf:'Jost',sans-serif; --bf:'Inter',sans-serif; --mf:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:linear-gradient(rgba(10,10,11,.8),rgba(10,10,11,.8)),url('images/blueprints/method-of-mining-coal.jpg') center top/cover no-repeat fixed;color:var(--bone);font-family:var(--bf);font-weight:300;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
@media(max-width:900px){body{background-attachment:scroll}}
::selection{background:var(--copper);color:var(--onyx)}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,64px)}
section{padding:clamp(64px,10vh,120px) 0;position:relative}
.eyebrow{font-family:var(--sf);font-weight:400;font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--copper-bright);display:flex;align-items:center;gap:16px;margin-bottom:24px}
.eyebrow::before{content:'';width:34px;height:1px;background:var(--copper)}
h1,h2,h3{font-family:var(--df);font-weight:500;color:var(--bone)}
h2{font-size:clamp(28px,4.2vw,50px);line-height:1.15;letter-spacing:-.01em;max-width:20ch}
h2 em{font-style:italic;color:var(--copper-bright)}
h3{font-size:20px}
.lede{font-size:clamp(15px,1.6vw,19px);color:var(--platinum);max-width:66ch;margin-top:20px}
.lede strong{color:var(--bone);font-weight:500}
.mono{font-family:var(--mf)}
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s cubic-bezier(.22,.9,.3,1),transform .8s cubic-bezier(.22,.9,.3,1)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.1s}.rv.d2{transition-delay:.2s}.rv.d3{transition-delay:.3s}.rv.d4{transition-delay:.4s}.rv.d5{transition-delay:.5s}

/* ---------- NAV ---------- */
#bar{position:fixed;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--copper),var(--copper-bright));z-index:200}
nav{position:fixed;top:0;left:0;right:0;z-index:150;display:flex;justify-content:space-between;align-items:center;
 padding:14px clamp(20px,5vw,64px);background:rgba(10,10,11,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.navmark{display:flex;align-items:center;gap:10px;font-family:var(--sf);letter-spacing:.05em;font-size:13px;color:var(--bone);text-decoration:none;font-weight:500}
.navmark img{width:28px;height:auto}
.navlinks{display:flex;gap:clamp(8px,1.4vw,18px);align-items:center}
.navlinks a{font-family:var(--sf);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--platinum);text-decoration:none;transition:color .3s;padding:6px 0;position:relative;white-space:nowrap}
.navlinks a::after{content:'';position:absolute;bottom:0;left:0;width:0;height:1px;background:var(--copper-bright);transition:width .3s}
.navlinks a:hover,.navlinks a.active{color:var(--bone)}
.navlinks a:hover::after,.navlinks a.active::after{width:100%}
.navlinks a.btn-nav{border:1px solid var(--line-copper);padding:9px 18px;color:var(--copper-bright)}
.navlinks a.btn-nav::after{display:none}
.navlinks a.btn-nav:hover{background:var(--copper);color:var(--onyx);border-color:var(--copper)}
.burger{display:none;flex-direction:column;gap:5px;background:none;border:0;cursor:pointer;padding:6px}
.burger span{width:24px;height:1.5px;background:var(--bone);transition:.3s}
@media(max-width:900px){
 .burger{display:flex}
 .navlinks{position:fixed;inset:57px 0 auto 0;background:rgba(10,10,11,.98);flex-direction:column;gap:0;padding:16px 0 28px;
  border-bottom:1px solid var(--line);transform:translateY(-120%);transition:transform .4s cubic-bezier(.3,.9,.3,1)}
 .navlinks.open{transform:none}
 .navlinks a{padding:14px 28px;width:100%;font-size:13px}
 .navlinks a.btn-nav{margin:10px 28px;text-align:center}
}

/* ---------- HERO ---------- */
.hero{min-height:92svh;display:flex;flex-direction:column;justify-content:center;padding-top:120px;
 background:radial-gradient(1100px 520px at 18% 12%,rgba(173,106,61,.14),transparent 62%),
            radial-gradient(760px 460px at 88% 88%,rgba(58,56,61,.5),transparent 60%),var(--onyx)}
.hero-lockup{width:min(320px,70vw);margin-bottom:30px}
h1{font-size:clamp(38px,6.6vw,86px);line-height:1.05;letter-spacing:-.015em;max-width:15ch}
h1 .it{font-style:italic;color:var(--copper-bright)}
.hero-sub{margin-top:26px;font-size:clamp(15px,1.7vw,20px);color:var(--platinum);max-width:58ch}
