  <g stroke-width="1">
    <line x1="180" y1="760" x2="330" y2="820"/>
    <circle cx="330" cy="820" r="3" fill="#AD6A3D" stroke="none"/>
    <line x1="668" y1="255" x2="790" y2="150"/>
    <circle cx="790" cy="150" r="3" fill="#AD6A3D" stroke="none"/>
    <line x1="500" y1="420" x2="420" y2="520"/>
    <circle cx="420" cy="520" r="3" fill="#AD6A3D" stroke="none"/>
  </g>

  <!-- Fine registration ticks along an implied baseline -->
  <g stroke-width="0.8">
    <line x1="40" y1="70" x2="40" y2="86"/>
    <line x1="70" y1="70" x2="70" y2="82"/>
    <line x1="100" y1="70" x2="100" y2="86"/>
    <line x1="130" y1="70" x2="130" y2="82"/>
    <line x1="160" y1="70" x2="160" y2="86"/>
