<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" fill="none" stroke="#AD6A3D" stroke-width="1.4">
  <!-- Gauge / dial assembly -->
  <circle cx="560" cy="340" r="210" stroke-width="1.2"/>
  <circle cx="560" cy="340" r="150" stroke-width="1"/>
  <circle cx="560" cy="340" r="4" fill="#AD6A3D" stroke="none"/>
  <g stroke-width="1">
    <line x1="560" y1="118" x2="560" y2="150"/>
    <line x1="560" y1="530" x2="560" y2="562"/>
    <line x1="338" y1="340" x2="370" y2="340"/>
    <line x1="750" y1="340" x2="782" y2="340"/>
    <line x1="405" y1="185" x2="425" y2="203"/>
    <line x1="715" y1="185" x2="695" y2="203"/>
    <line x1="405" y1="495" x2="425" y2="477"/>
    <line x1="715" y1="495" x2="695" y2="477"/>
  </g>
  <line x1="560" y1="340" x2="668" y2="255" stroke-width="1.6"/>
  <line x1="560" y1="340" x2="500" y2="420" stroke-width="1.2"/>

  <!-- Shaft / crossbeam -->
  <line x1="90" y1="620" x2="560" y2="620" stroke-width="1.2"/>
  <line x1="90" y1="580" x2="90" y2="660"/>
  <line x1="560" y1="580" x2="560" y2="660"/>
  <g stroke-width="1">
    <line x1="150" y1="596" x2="150" y2="644"/>
    <line x1="230" y1="596" x2="230" y2="644"/>
    <line x1="310" y1="596" x2="310" y2="644"/>
    <line x1="390" y1="596" x2="390" y2="644"/>
    <line x1="470" y1="596" x2="470" y2="644"/>
  </g>

  <!-- Hub / gear suggestion, lower-left -->
  <circle cx="180" cy="760" r="86" stroke-width="1.2"/>
  <circle cx="180" cy="760" r="40" stroke-width="1"/>
  <g stroke-width="1">
    <line x1="180" y1="654" x2="180" y2="676"/>
    <line x1="180" y1="844" x2="180" y2="866"/>
    <line x1="94" y1="760" x2="116" y2="760"/>
    <line x1="244" y1="760" x2="266" y2="760"/>
    <line x1="119" y1="699" x2="135" y2="715"/>
    <line x1="241" y1="699" x2="225" y2="715"/>
    <line x1="119" y1="821" x2="135" y2="805"/>
    <line x1="241" y1="821" x2="225" y2="805"/>
  </g>

