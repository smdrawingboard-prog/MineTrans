<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>MineTrans Insurance Brokers</title>
    <meta name="description" content="MineTrans structures specialist mining and marine insurance across South Africa and Sub-Saharan Africa, including business interruption, liability, plant and machinery, and transit cover. FSP 53166." />
    <!--
      This document is the React application shell. The production build writes it to
      dist/public/404.html and it is what the server returns for any path that is not a
      real file, so it renders for client-side app routes (/certification, /admin, …) and
      for unknown URLs alike. It must therefore stay noindex: the indexable marketing
      pages are the static HTML files in client/public/, and the homepage at "/" is
      client/public/index.html, not this shell. Marking it index,follow would create soft
      404s and a duplicate of the homepage at every non-existent URL.
    -->
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <meta name="theme-color" content="#AD6A3D" />
    <meta property="og:title" content="MineTrans Insurance Brokers" />
    <meta property="og:description" content="Specialist mining and marine insurance for mine assets, liability, business interruption, machinery and land, air and sea transit across Sub-Saharan Africa." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_ZA" />
    <meta property="og:site_name" content="MineTrans Insurance Brokers" />
    <meta property="og:image" content="https://www.minetrans.co.za/images/og/og-default.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MineTrans Insurance Brokers" />
    <meta name="twitter:description" content="Specialist mining and marine insurance across South Africa and Sub-Saharan Africa. FSP 53166." />
    <meta name="twitter:image" content="https://www.minetrans.co.za/images/og/og-default.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
