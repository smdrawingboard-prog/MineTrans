name: Crawl Mining News

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run crawl:news

      - name: Open or update news feed pull request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: client/public/news-data.json
          branch: automation/mining-news
          commit-message: Update mining news feed
          title: Update mining news feed
          body: |
            Scheduled mining news refresh. Review the article selection and merge to publish the update.
