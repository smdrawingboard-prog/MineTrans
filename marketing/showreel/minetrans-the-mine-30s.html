/* ---------- easing, all functions of time ---------- */
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function spr(x, f = 2.4, z = 0.78) {
  if (x <= 0) return 0;
  const w = TAU * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x));
}
function eio(u, k = 5) {
  u = clamp(u, 0, 1);
  const h = x => (Math.exp(k * x) - 1) / (Math.exp(k) - 1);
  return u < 0.5 ? 0.5 * h(2 * u) : 1 - 0.5 * h(2 - 2 * u);
}
const bump = (x, k = 9, w = 13) => x <= 0 ? 0 : Math.exp(-k * x) * Math.sin(w * x) * 1.9;

/* ---------- camera ---------- */
let KF = [];
function pushAt(t) {
  for (let i = 0; i < SCENES.length; i++) {
    const s = SCENES[i];
    if (t < s.t1 || i === SCENES.length - 1) return Math.pow(1.04, i + clamp((t - s.t0) / (s.t1 - s.t0), 0, 1));
  }
}
function camAt(t) {
  let a = KF[0], b = KF[0];
  if (t >= KF[KF.length - 1].t) a = b = KF[KF.length - 1];
  else for (let i = 0; i < KF.length - 1; i++) if (t >= KF[i].t && t < KF[i + 1].t) { a = KF[i]; b = KF[i + 1]; break; }
  const u = a === b ? 0 : eio((t - a.t) / (b.t - a.t), 4.5);
  const z = Math.exp(lerp(Math.log(a.z), Math.log(b.z), u)) * pushAt(t);
  return { cx: lerp(a.cx, b.cx, u), cy: lerp(a.cy, b.cy, u), z };
}

const $ = id => document.getElementById(id);
function wr(id) { const r = $(id).getBoundingClientRect(); return { l: r.left, t: r.top, r: r.right, b: r.bottom, w: r.width, h: r.height, cx: r.left + r.width / 2, cy: r.top + r.height / 2 }; }
const WRAP = {};

function resolve() {

    const ref = KF[KF.length - 1];
    if (i > 0) KF.push({ t: sc.t0, cx: ref.cx, cy: ref.cy, z: ref.z });
    const c = camAt(sc.t0);
    const s = 1 / c.z, ox = c.cx - 960 * s, oy = c.cy - 540 * s;
    WRAP[sc.id] = { ox, oy, s };
    ['b', 'f'].forEach(k => LAYERS[sc.id + k].style.transform = `translate(${ox}px,${oy}px) scale(${s})`);
    const base = KF[KF.length - 1];
    CAMK[sc.id].forEach(k => {
      if (!k.el) { KF.push({ t: k.t, cx: base.cx, cy: base.cy, z: base.z }); return; }
      const r = wr(k.el);
      KF.push({ t: k.t, cx: lerp(base.cx, r.cx, k.b), cy: lerp(base.cy, r.cy, k.b), z: base.z * k.rel });
    });
  });

/* ---------- through-line object: the production pulse, then the copper frame ---------- */

const FILL_DELAY = 0.28;   // a frame that becomes an underline stays an outline until it has shrunk, so it never covers the text
function objAt(t) {
