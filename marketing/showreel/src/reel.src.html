<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MineTrans Showreel</title>
<style>
@font-face{font-family:PF;src:url(data:font/woff2;base64,{{PF_N}}) format('woff2');font-weight:400 900;font-style:normal}
@font-face{font-family:PF;src:url(data:font/woff2;base64,{{PF_I}}) format('woff2');font-weight:400 900;font-style:italic}
:root{--onyx:#0A0A0B;--char:#1E1D20;--plat:#C9CACE;--bone:#F7F5F1;--cu:#C9854F;--line:rgba(201,202,206,.16)}
html,body{margin:0;padding:0;background:var(--onyx);overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--onyx);
  font-family:PF,serif;color:var(--bone);font-weight:500;-webkit-font-smoothing:antialiased}
#cam,.layer{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.a{position:absolute}
.m{display:inline-block;overflow:hidden;vertical-align:top;padding:.04em .08em .16em;margin:-.04em -.08em -.16em}
.i{display:inline-block}
.blk{display:block}
.mask{overflow:hidden}
.full{position:absolute;left:0;right:0;top:0;text-align:center}
.cap{text-transform:uppercase;letter-spacing:.16em}
.cu{color:var(--cu)}
em{font-style:italic;font-weight:500}
.cell{position:absolute;width:104px;height:104px;background:var(--onyx);transform-origin:50% 50%}
.cell svg.bd{position:absolute;left:0;top:0;overflow:visible}
.cell svg.ic{position:absolute;left:30px;top:30px;width:44px;height:44px}
.nm{position:absolute;width:360px;text-align:center;font-size:19px;color:var(--plat)}
.stl{position:absolute;width:420px;height:34px;line-height:34px;overflow:hidden;font-size:19px;letter-spacing:.1em;color:rgba(247,245,241,.78)}
.imp{position:absolute;border:1px solid rgba(201,202,206,.32);background:rgba(201,202,206,.035);display:flex;align-items:center;
  gap:44px;padding:0 34px;box-sizing:border-box;border-radius:2px}
.imp .ih{font-size:18px;letter-spacing:.22em;text-transform:uppercase;color:var(--plat)}
.imp .iv{font-size:28px;color:var(--bone)}
.field{position:absolute;height:64px;background:var(--onyx);border:1px solid rgba(201,202,206,.2);box-sizing:border-box;border-radius:2px}
.lbl{position:absolute;font-size:17px;letter-spacing:.16em;text-transform:uppercase;color:var(--plat)}
.row{position:absolute;height:58px;line-height:58px;font-size:25px;padding-left:34px;box-sizing:border-box}
#cursor{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
#obj{position:absolute;background:var(--cu);overflow:hidden}
#objHole{position:absolute;background:var(--onyx)}
</style>
</head>
<body>
<div id="stage">
  <svg width="0" height="0" style="position:absolute">
    <filter id="fbObj" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur id="fbObjG" stdDeviation="0 0"/></filter>
    <filter id="fbCur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur id="fbCurG" stdDeviation="0 0"/></filter>
  </svg>
  <div id="cam"></div>
</div>
<script>
/* ============================================================
   MineTrans showreel — every style is a pure function of t.
   ============================================================ */
const BPM = 120, BEAT = 60 / BPM, DUR = 15;
const SCENES = [
  { id: 's1', t0: 0,  t1: 2  },   // hook
  { id: 's2', t0: 2,  t1: 6  },   // cascade
  { id: 's3', t0: 6,  t1: 8  },   // settlement gap
  { id: 's4', t0: 8,  t1: 12 },   // request review
  { id: 's5', t0: 12, t1: 14 },   // covered (payoff)
  { id: 's6', t0: 14, t1: 15 },   // end card
];

/* ---------- easing, all functions of time ---------- */
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
// damped spring step response; zeta .78 keeps overshoot under 2%
function spr(x, f = 2.4, z = 0.78) {
  if (x <= 0) return 0;
  const w = TAU * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x));
}
// exponential in-out over a normalized window
function eio(u, k = 5) {
  u = clamp(u, 0, 1);
  const h = x => (Math.exp(k * x) - 1) / (Math.exp(k) - 1);
  return u < 0.5 ? 0.5 * h(2 * u) : 1 - 0.5 * h(2 - 2 * u);
}
const eo = (x, k = 7) => x <= 0 ? 0 : 1 - Math.exp(-k * x);
// decaying impulse 0 -> peak -> 0, for squash / press
const bump = (x, k = 9, w = 13) => x <= 0 ? 0 : Math.exp(-k * x) * Math.sin(w * x) * 1.9;

/* ---------- markup helpers ---------- */
function words(str, tin, step = 0.06, tout = null, ostep = 0.03, cls = '') {
  return str.split(' ').map((w, i) =>
    `<span class="m"><span class="i r ${cls}" data-in="${(tin + i * step).toFixed(3)}"${tout != null ? ` data-out="${(tout + i * ostep).toFixed(3)}"` : ''}>${w}</span></span>`
  ).join(' ');
}
const ICON = {
  pit:   '<path d="M3 20h18M6 20V9l6-5 6 5v11"/><path d="M10 20v-5h4v5"/>',
  mill:  '<circle cx="12" cy="12" r="7"/><path d="M12 5v3M12 16v3M5 12h3M16 12h3"/>',
  plant: '<path d="M4 17l5-5 4 4 7-8"/><path d="M20 8v4h-4"/>',
  port:  '<path d="M3 18h13l5-6-5-6H3"/><path d="M3 6v12"/>',
};
const COLS = [435, 785, 1135, 1485], LINE_Y = 640;
const NAMES = ['Pit / Shaft', 'Primary Mill', 'Plant / Process', 'Rail / Port'];

function flowNodes(p, tin, tout, statuses, iconColor) {
  let h = '';
  COLS.forEach((cx, k) => {
    const ic = ['pit', 'mill', 'plant', 'port'][k];
    const col = typeof iconColor === 'function' ? iconColor(k) : iconColor;
    h += `<div class="cell gy" id="${p}c${k}" data-in="${tin + k * 0.05}" data-out="${tout + k * 0.04}" data-f="2.6" style="left:${cx - 52}px;top:${LINE_Y - 52}px">
      <svg class="bd" width="104" height="104"><rect id="${p}bd${k}" x=".75" y=".75" width="102.5" height="102.5" fill="none" stroke="rgba(201,202,206,.42)" stroke-width="1.5"/></svg>
      <svg class="ic" id="${p}ic${k}" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="1.3">${ICON[ic]}</svg></div>`;
    h += `<div class="nm cap" style="left:${cx - 180}px;top:712px">${words(NAMES[k].toUpperCase(), tin + 0.12 + k * 0.04, 0.03, tout, 0.01)}</div>`;
    h += `<div class="stl" id="${p}st${k}" style="left:${cx - 210}px;top:748px">`;
    statuses[k].forEach(s => {
      h += `<div class="i r full" data-in="${s.tin}"${s.tout != null ? ` data-out="${s.tout}"` : ''} data-f="3">${s.txt}</div>`;
    });
    h += `</div>`;
  });
  return h;
}

/* ---------- scene markup (authored in screen space at the scene's reference time) ---------- */
function buildScenes() {
  const S = {};
  // S1 — hook
  S.s1b = `<div class="a" id="hookLine" style="height:1.5px;background:rgba(201,202,206,.42);transform-origin:0 50%"></div>`;
  S.s1f = `
    <div class="a" id="hl1" style="left:0;width:1920px;top:214px;text-align:center;font-size:146px;line-height:1.08;letter-spacing:-.012em">
      ${words('One failure', 0.0, 0.07, 1.62, 0.05)}</div>
    <div class="a" id="hl2" style="left:0;width:1920px;top:376px;text-align:center;font-size:146px;line-height:1.08;letter-spacing:-.012em">
      <span id="hl2in">${words('stops', 0.5)} <span class="m"><span class="i r cu" data-in="1.0"><em>everything</em></span></span><span id="hookDotA" style="display:inline-block;width:.2em;height:0"></span></span></div>`;

  // S2 — cascade (fail)
  const st2 = [
    [{ txt: 'RUNNING', tin: 2.2, tout: 5.8 }],
    [{ txt: 'RUNNING', tin: 2.24, tout: 3.0 }, { txt: 'FAILED', tin: 3.06, tout: 5.8 }],
    [{ txt: 'RUNNING', tin: 2.28, tout: 3.5 }, { txt: 'STOPPED', tin: 3.56, tout: 5.82 }],
    [{ txt: 'SHIPPING', tin: 2.32, tout: 4.0 }, { txt: 'IDLE', tin: 4.06, tout: 5.84 }],
  ];
  S.s2b = `
    <div class="a cl" data-dir="v" data-in="2.0" data-out="5.92" data-f="2.2" style="left:200px;top:330px;width:1520px;height:690px;border:1px solid var(--line);border-radius:4px;box-sizing:border-box;background:rgba(30,29,32,.42)"></div>
    <div class="a gx" id="s2line" data-in="2.0" data-f="50" data-out="5.86" data-fo="2.4" style="left:428px;top:${LINE_Y - 0.75}px;width:1064px;height:1.5px;background:rgba(201,202,206,.42);transform-origin:0 50%"></div>`;
  S.s2f = `
    <div class="a" style="left:262px;top:372px;font-size:42px">${words('Watch what one failure does', 2.1, 0.04, 5.78, 0.02)}</div>
    ${flowNodes('s2', 2.0, 5.86, st2, 'var(--plat)')}
    <div class="a cl" id="s2toggle" data-dir="l" data-in="2.2" data-out="5.8" data-f="2.4" style="left:1490px;top:806px;width:170px;height:54px;border:1px solid rgba(201,202,206,.38);border-radius:2px;box-sizing:border-box">
      <div class="a mask" style="left:0;top:0;width:168px;height:52px">
        <div class="i r full" data-in="2.25" data-out="2.5" data-f="3.2" style="top:0;line-height:52px;font-size:21px;letter-spacing:.06em">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--plat)" stroke-width="2" style="vertical-align:-2px;margin-right:8px"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>Replay</div>
        <div class="i r full" data-in="2.56" data-out="5.8" data-f="3.2" style="top:0;line-height:52px;font-size:21px;letter-spacing:.06em">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--plat)" style="vertical-align:-1px;margin-right:9px"><rect x="5" y="4" width="4.5" height="16"/><rect x="14.5" y="4" width="4.5" height="16"/></svg>Pause</div>
      </div></div>
    <div class="imp cl" id="s2imp" data-dir="l" data-in="4.5" data-out="5.72" data-f="2.2" style="left:260px;top:884px;width:1400px;height:76px">
      <span class="ih">${words('Impact — uninsured', 4.56, 0.04, 5.74, 0.01)}</span>
      <span class="iv">${words('Production halted', 5.0, 0.04, 5.76, 0.01)}</span>
      <span class="iv">${words('Fixed costs continue', 5.12, 0.04, 5.77, 0.01)}</span>
      <span class="iv">${words('Payroll continues', 5.5, 0.04, 5.78, 0.01)}</span>
    </div>`;

  // S3 — illustrative settlement
  const rows3 = [
    ['Actual gross profit', 'R100m', 1.00, 6.0, 'rgba(0,0,0,0)'],
    ['Declared value', 'R65m', 0.65, 6.5, 'rgba(201,202,206,.55)'],
    ['Likely settlement', '±R42m', 0.42, 7.0, 'rgba(247,245,241,.82)'],
    ['Uninsured shortfall', '−R58m', 0.58, 7.5, 'outline'],
  ];
  let r3b = '', r3f = '';
  rows3.forEach(([lab, val, w, tin, col], k) => {
    const y = 548 + k * 84;
    r3b += `<div class="a gx" data-in="${tin - 0.04}" data-out="${7.84 + k * 0.03}" data-f="3" style="left:700px;top:${y - 7}px;width:700px;height:14px;background:rgba(201,202,206,.07);transform-origin:0 50%"></div>`;
    if (k === 0) r3b += `<div class="a" id="s3f0" style="left:700px;top:${y - 7}px;width:700px;height:14px"></div>`;
    else r3b += `<div class="a gx" id="s3f${k}" data-in="${tin}" data-out="${7.86 + k * 0.03}" data-f="1.9" style="left:700px;top:${y - 7}px;width:${700 * w}px;height:14px;transform-origin:0 50%;${col === 'outline' ? 'box-shadow:inset 0 0 0 1.5px rgba(247,245,241,.85)' : 'background:' + col}"></div>`;
    r3f += `<div class="a cap" style="left:362px;top:${y - 13}px;width:320px;font-size:17px;letter-spacing:.14em;color:var(--plat)">${words(lab.toUpperCase(), tin + 0.02, 0.03, 7.8 + k * 0.02, 0.01)}</div>`;
    r3f += `<div class="a" style="left:1432px;top:${y - 22}px;font-size:34px">${words(val, tin + 0.16, 0, 7.82 + k * 0.02, 0, k === 3 ? 'cu' : '')}</div>`;
  });
  S.s3b = `<div class="a cl" data-dir="v" data-in="6.0" data-out="7.92" data-f="2.2" style="left:300px;top:330px;width:1320px;height:590px;background:var(--char);border:1px solid var(--line);border-radius:4px;box-sizing:border-box"></div>${r3b}`;
  S.s3f = `
    <div class="a" style="left:362px;top:382px;font-size:40px">${words('Illustrative BI settlement — under-declared values', 6.1, 0.035, 7.78, 0.01)}</div>
    <div class="a" style="left:362px;top:442px;font-size:21px;color:rgba(201,202,206,.78);font-weight:400">${words('Figures are illustrative only and do not represent an actual claim or a forecast of any outcome.', 6.2, 0.012, 7.8, 0.004)}</div>
    ${r3f}`;

  // S4 — request a review
  const opts = ['Business Interruption', 'Tailings', 'Machinery', 'Supply Chain', 'Multiple'];
  let rows4 = '';
  opts.forEach((o, k) => {
    rows4 += `<div class="row" id="s4row${k}" style="left:420px;top:${672 + k * 58}px;width:1080px"><span class="m"><span class="i r s4rt" id="s4rt${k}" data-in="${9.03 + k * 0.025}" data-out="${10.04}" data-f="4">${o}</span></span></div>`;
  });
  S.s4b = `
    <div class="a cl" id="s4card" data-dir="t" data-in="8.02" data-out="11.6" data-f="1.9" style="left:360px;top:400px;width:1200px;height:560px;background:var(--char);border:1px solid var(--line);border-top:0;border-radius:0 0 4px 4px;box-sizing:border-box"></div>
    <div class="field cl" data-dir="l" data-in="8.5" data-out="11.54" style="left:420px;top:486px;width:520px"></div>
    <div class="field cl" data-dir="l" data-in="8.56" data-out="11.56" style="left:980px;top:486px;width:520px"></div>
    <div class="field cl" id="s4sel" data-dir="l" data-in="8.62" data-out="11.58" style="left:420px;top:604px;width:1080px"></div>
    <div class="a cl" id="s4btn" data-dir="l" data-in="8.7" data-out="11.5" style="left:420px;top:760px;width:360px;height:76px;border:1px solid rgba(201,202,206,.38);border-radius:2px;box-sizing:border-box"></div>
    <div class="a cl" id="s4list" data-dir="t" data-in="9.0" data-out="10.05" data-f="4.2" data-fo="4" style="left:420px;top:670px;width:1080px;height:294px;background:#2A292E;box-shadow:0 24px 48px rgba(0,0,0,.5);border-radius:2px"></div>`;
  S.s4f = `
    <div class="a" style="left:0;width:1920px;top:262px;text-align:center;font-size:66px">${words('Request a business interruption', 8.04, 0.05, 11.5, 0.02)} <span class="m"><span class="i r cu" data-in="8.3" data-out="11.6"><em>review.</em></span></span></div>
    <div class="lbl" style="left:420px;top:448px">${words('COMPANY NAME', 8.52, 0.03, 11.52, 0.01)}</div>
    <div class="lbl" style="left:980px;top:448px">${words('MINING SECTOR', 8.58, 0.03, 11.54, 0.01)}</div>
    <div class="a" style="left:1006px;top:502px;font-size:23px;color:rgba(201,202,206,.42);font-weight:400">${words('e.g. Copper, Gold, Coal, PGMs', 8.66, 0.02, 11.56, 0.005)}</div>
    <div class="lbl" style="left:420px;top:566px">${words('PRIMARY RISK AREA', 8.64, 0.03, 11.56, 0.01)}</div>
    <div class="a mask" style="left:446px;top:614px;width:900px;height:46px;font-size:25px">
      <div class="i r a" data-in="8.72" data-out="10.02" data-f="3.4" style="left:0;top:0;line-height:46px">Business Interruption</div>
      <div class="i r a" data-in="10.08" data-out="11.58" data-f="3.4" style="left:0;top:0;line-height:46px">Multiple</div></div>
    <svg class="a cl" data-dir="l" data-in="8.72" data-out="11.58" style="left:1450px;top:626px" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--plat)" stroke-width="1.6"><path d="M5 9l7 7 7-7"/></svg>
    ${rows4}
    <div class="a mask" style="left:420px;top:760px;width:360px;height:76px">
      <div class="i r full" id="s4bl0" data-in="8.76" data-out="8.97" data-f="3.2" style="top:0;line-height:76px;font-size:20px;letter-spacing:.28em">SUBMIT REQUEST</div>
      <div class="i r full" id="s4bl1" data-in="10.14" data-out="11.0" data-f="3.2" style="top:0;line-height:76px;font-size:20px;letter-spacing:.28em">SUBMIT REQUEST</div>
      <div class="i r full" id="s4bl2" data-in="11.06" data-out="11.56" data-f="3.2" style="top:0;line-height:76px;font-size:23px;letter-spacing:.04em">Submitting…</div></div>`;

  // S5 — covered (payoff)
  const st5 = [
    [{ txt: 'RUNNING', tin: 12.08, tout: 13.06 }],
    [{ txt: 'REBUILDING · COVERED', tin: 12.12, tout: 13.08 }],
    [{ txt: 'CASH FLOW PROTECTED', tin: 12.16, tout: 13.1 }],
    [{ txt: 'CASH FLOW PROTECTED', tin: 12.2, tout: 13.12 }],
  ];
  S.s5b = `
    <div class="a cl" data-dir="v" data-in="12.0" data-out="13.08" data-f="2.4" style="left:200px;top:330px;width:1520px;height:690px;border:1px solid var(--line);border-radius:4px;box-sizing:border-box;background:rgba(30,29,32,.42)"></div>
    <div class="a gx" data-in="12.0" data-f="2.2" data-out="13.02" data-fo="3" style="left:428px;top:${LINE_Y - 0.75}px;width:1064px;height:1.5px;background:rgba(201,202,206,.42);transform-origin:0 50%"></div>`;
  S.s5f = `
    <div class="a" style="left:262px;top:372px;font-size:42px">${words('Recovery under a properly structured programme', 12.06, 0.04, 13.0, 0.02)}</div>
    ${flowNodes('s5', 12.0, 13.04, st5, k => k === 1 ? 'var(--cu)' : 'var(--plat)')}
    <div class="imp cl" id="s5imp" data-dir="l" data-in="12.25" data-out="13.0" data-f="2.4" style="left:260px;top:884px;width:1400px;height:76px">
      <span class="ih">${words('Impact —', 12.3, 0.04, 13.02, 0.01)} <span class="m"><span class="i r cu" data-in="12.38" data-out="13.03">covered</span></span></span>
      <span class="iv">${words('Rebuild funded', 12.5, 0.04, 13.04, 0.01)}</span>
      <span class="iv">${words('Fixed costs paid', 12.6, 0.04, 13.05, 0.01)}</span>
      <span class="iv">${words('Cash flow protected', 12.72, 0.04, 13.06, 0.01)}</span>
    </div>`;

  // S6 — end card
  S.s6b = ``;
  S.s6f = `
    <div class="a" style="left:0;top:330px;width:1920px;display:flex;justify-content:center;align-items:center;gap:70px">
      <div id="s6badge" style="width:330px;height:236px;position:relative">
        <div class="a mask" style="left:0;top:0;width:330px;height:236px;text-align:center">
          <div class="i r" data-in="13.34" data-f="2.4" style="font-size:150px;line-height:236px;color:var(--cu);letter-spacing:-.02em;padding-left:6px">MT</div></div>
      </div>
      <div style="width:820px">
        <div class="cl" id="s6word" data-dir="l" data-in="13.52" data-f="1.7" style="font-size:118px;line-height:1;letter-spacing:.075em;font-weight:400;white-space:nowrap">MINETRANS</div>
        <div style="margin-top:26px;font-size:43px;letter-spacing:.255em;font-weight:400;white-space:nowrap">${words('INSURANCE BROKERS', 14.0, 0.06)}</div>
      </div>
    </div>
    <div class="a" style="left:0;width:1920px;top:742px;text-align:center;font-size:36px;color:var(--plat);font-weight:400">
      ${words('Request a no-obligation review', 14.5, 0.035)} <span class="m"><span class="i r" data-in="14.62" style="color:rgba(201,202,206,.55)">·</span></span> ${words('minetrans.co.za', 14.66, 0.03, null, 0, '')}</div>`;
  return S;
}

/* ---------- build DOM ---------- */
const cam = document.getElementById('cam');
const LAYERS = {};
function buildDOM() {
  const S = buildScenes();
  const order = [];
  SCENES.forEach(s => order.push(s.id + 'b'));
  order.push('OBJ');
  SCENES.forEach(s => order.push(s.id + 'f'));
  order.push('CURSOR');
  order.forEach(k => {
    if (k === 'OBJ') { cam.insertAdjacentHTML('beforeend', '<div id="obj" style="filter:url(#fbObj)"><div id="objHole"></div></div>'); return; }
