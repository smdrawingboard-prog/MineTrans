<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Mine — 30s</title>
<style>
@font-face{font-family:PF;src:url(data:font/woff2;base64,{{PF_N}}) format('woff2');font-weight:400 900;font-style:normal}
@font-face{font-family:PF;src:url(data:font/woff2;base64,{{PF_I}}) format('woff2');font-weight:400 900;font-style:italic}
:root{--onyx:#0A0A0B;--char:#1E1D20;--plat:#C9CACE;--bone:#F7F5F1;--cu:#C9854F;--line:rgba(201,202,206,.18);--img:#2B3337}
html,body{margin:0;padding:0;background:var(--onyx);overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--onyx);
  font-family:PF,serif;color:var(--bone);font-weight:500;-webkit-font-smoothing:antialiased}
#cam,.layer{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.a{position:absolute}
.m{display:inline-block;overflow:hidden;vertical-align:top;padding:.04em .08em .16em;margin:-.04em -.08em -.16em}
.i{display:inline-block}
.mask{overflow:hidden}
.full{position:absolute;left:0;right:0;top:0;text-align:center}
.cap{text-transform:uppercase;letter-spacing:.12em}
.cu{color:var(--cu)}
em{font-style:italic;font-weight:500}
/* phone-first type: nothing that carries meaning is under 30px on the 1920 frame */
.eb{position:absolute;font-size:30px;letter-spacing:.26em;text-transform:uppercase;color:var(--plat);font-weight:500;white-space:nowrap}
.eb .rule{display:inline-block;width:56px;height:2px;background:rgba(201,202,206,.6);vertical-align:middle;margin-right:24px;transform-origin:0 50%}
.h1{position:absolute;font-size:84px;line-height:1.08;letter-spacing:-.01em}
.h2{position:absolute;font-size:76px;line-height:1.1;letter-spacing:-.01em}
.body{position:absolute;font-size:46px;line-height:1.3;font-weight:400}
.piece{position:absolute;transform-origin:0 0}
.piece .px{position:absolute;inset:0}
.cell{position:absolute;background:var(--onyx);transform-origin:50% 50%}
.cell svg.bd{position:absolute;left:0;top:0;overflow:visible}
.cell svg.ic{position:absolute}
.nm{position:absolute;width:420px;text-align:center;font-size:34px;color:var(--plat)}
.stl{position:absolute;width:420px;height:48px;line-height:48px;overflow:hidden;font-size:36px;letter-spacing:.06em;color:var(--bone)}
.imp{position:absolute;border:1px solid rgba(201,202,206,.32);background:rgba(201,202,206,.04);box-sizing:border-box;border-radius:2px;padding:20px 40px}
.imp .ih{font-size:30px;letter-spacing:.2em;text-transform:uppercase;color:var(--plat)}
.imp .row{display:flex;gap:64px;margin-top:14px}
.imp .iv{font-size:48px;color:var(--bone)}
.lia{position:absolute;width:520px;font-size:46px;line-height:1.15}
.box{position:absolute;width:104px;height:104px;border:2px solid rgba(201,202,206,.3);box-sizing:border-box;border-radius:4px;text-align:center;line-height:100px;font-size:60px;color:var(--plat)}
#cursor{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
#obj{position:absolute}
</style>
</head>
<body>
<div id="stage">
  <svg width="0" height="0" style="position:absolute">
    <filter id="fbObj" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur id="fbObjG" stdDeviation="0 0"/></filter>
    <filter id="fbCur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur id="fbCurG" stdDeviation="0 0"/></filter>
  </svg>
  <div id="cam"></div>
</div>
<script>
/* ============================================================
   MineTrans — "The Mine" explainer, 30s at 120 BPM. Every style is a pure function of t.
   Opens on the operational consequence (one mill failure), then the connected exposures.
   Copy: client/public/insurance-mine.html. Image: images/diagrams/mine-risk-assessment.webp
   Insurance wording is qualified: cover responds subject to the policy's trigger, terms and indemnity period.
   ============================================================ */
const BPM = 120, BEAT = 60 / BPM, DUR = 30;
const IMG = 'data:image/webp;base64,{{IMG}}';
const SCENES = [
  { id: 's1', t0: 0,  t1: 5  },   // cold open: one mill failure
  { id: 's2', t0: 5,  t1: 8  },   // the connected exposures, on the diagram
  { id: 's3', t0: 8,  t1: 12 },   // assets
  { id: 's4', t0: 12, t1: 16 },   // liability
  { id: 's5', t0: 16, t1: 21 },   // business interruption, qualified
  { id: 's6', t0: 21, t1: 24 },   // quantified upfront
  { id: 's7', t0: 24, t1: 27 },   // unless it's covered (payoff on 24s)
  { id: 's8', t0: 27, t1: 30 },   // end card
];

/* ---------- easing, all functions of time ---------- */
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function spr(x, f = 2.4, z = 0.78) {
  if (x <= 0) return 0;
  const w = TAU * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x));
}
function eio(u, k = 5) {
  u = clamp(u, 0, 1);
  const h = x => (Math.exp(k * x) - 1) / (Math.exp(k) - 1);
  return u < 0.5 ? 0.5 * h(2 * u) : 1 - 0.5 * h(2 - 2 * u);
}
const bump = (x, k = 9, w = 13) => x <= 0 ? 0 : Math.exp(-k * x) * Math.sin(w * x) * 1.9;

/* ---------- markup helpers ---------- */
function words(str, tin, step = 0.06, tout = null, ostep = 0.03, cls = '') {
  return str.split(' ').map((w, i) =>
    `<span class="m"><span class="i r ${cls}" data-in="${(tin + i * step).toFixed(3)}"${tout != null ? ` data-out="${(tout + i * ostep).toFixed(3)}"` : ''}>${w}</span></span>`
  ).join(' ');
}
const eyebrow = (txt, x, y, tin, tout) =>
  `<div class="eb" style="left:${x}px;top:${y}px"><span class="rule gx" data-in="${tin}" data-out="${tout}" data-f="2.4"></span>${words(txt, tin + 0.06, 0.03, tout, 0.01)}</div>`;
const anchor = (id, l, t, w, h) => `<div class="a" id="${id}" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px"></div>`;

const ICON = {
  pit:   '<path d="M3 20h18M6 20V9l6-5 6 5v11"/><path d="M10 20v-5h4v5"/>',
  mill:  '<circle cx="12" cy="12" r="7"/><path d="M12 5v3M12 16v3M5 12h3M16 12h3"/>',
  plant: '<path d="M4 17l5-5 4 4 7-8"/><path d="M20 8v4h-4"/>',
  port:  '<path d="M3 18h13l5-6-5-6H3"/><path d="M3 6v12"/>',
};
// the cascade, sized for a phone: 150px nodes across a 1640px frame
const COLS = [345, 755, 1165, 1575], LINE_Y = 560, CS = 150;
const NAMES = ['Pit / Shaft', 'Primary Mill', 'Plant / Process', 'Rail / Port'];

/* ---------- the diagram, cut into pieces (image px) ---------- */
const PX = 60, PY = 213, PW = 1200, PH = PW * 768 / 1408, PS = PW / 1408;
const PIECES = [
  { id: 'trL', poly: [[330, 600], [560, 520], [612, 545], [612, 702], [330, 702]] },
  { id: 'trR', poly: [[830, 545], [940, 450], [940, 375], [1010, 365], [1312, 420], [1312, 565], [1180, 655], [950, 655]] },
  { id: 'core', poly: [[560, 95], [850, 95], [850, 330], [942, 360], [942, 538], [705, 632], [468, 532], [468, 360], [560, 330]] },
  { id: 'pd', poly: [[70, 285], [472, 285], [472, 588], [305, 684], [70, 566]],
              rect: [[70, 285], [472, 285], [472, 684], [305, 684], [70, 684]] },
  { id: 'bi', poly: [[960, 85], [1345, 85], [1345, 396], [1236, 404], [1110, 446], [968, 392]],
              rect: [[960, 85], [1345, 85], [1345, 446], [1345, 446], [1110, 446], [960, 446]] },
  { id: 'prod', poly: [[985, 456], [1180, 440], [1332, 520], [1332, 612], [1150, 684], [988, 606]],
              rect: [[960, 446], [1345, 446], [1345, 446], [1345, 684], [1150, 684], [960, 684]] },
];
const bboxOf = poly => { const xs = poly.map(p => p[0]), ys = poly.map(p => p[1]); return { l: Math.min(...xs), t: Math.min(...ys), r: Math.max(...xs), b: Math.max(...ys) }; };
// motion drawn on the diagram itself, in image px. 'pulse' = beads travelling a line, 'light' = the line drawn in light once
const FLOWS = {
  trL: [   // property damage -> the MineTrans core
    { pts: [[339, 660], [386, 686], [440, 686], [539, 640], [539, 597], [597, 563]], kind: 'pulse', from: 5.4, to: 7.7, every: 0.3 },
    { pts: [[350, 652], [391, 676], [442, 676], [527, 635], [527, 590], [587, 558]], kind: 'pulse', from: 5.5, to: 7.7, every: 0.3 },
    { pts: [[457, 601], [480, 590], [480, 573], [547, 535]], kind: 'pulse', from: 5.45, to: 7.7, every: 0.26 },
  ],
  core: [  // actuarial, technical, technology — in turn
    { pts: [[571, 212], [705, 292], [839, 212]], kind: 'light', at: 5.8 },
    { pts: [[571, 275], [705, 355], [839, 275]], kind: 'light', at: 5.95 },
    { pts: [[571, 347], [705, 425], [839, 347]], kind: 'light', at: 6.1 },
  ],
  trR: [   // the core -> business interruption and production
    { pts: [[934, 452], [1030, 400]], kind: 'pulse', from: 6.2, to: 7.7, every: 0.22 },
    { pts: [[930, 438], [1022, 390]], kind: 'pulse', from: 6.28, to: 7.7, every: 0.22 },
    { pts: [[850, 532], [890, 560], [890, 628], [920, 650], [1010, 650], [1050, 628]], kind: 'pulse', from: 6.25, to: 7.7, every: 0.3 },
  ],
  pd:   [ { pts: [[84, 540], [285, 663], [450, 567]], kind: 'light', at: 6.45 },
          { pts: [[84, 540], [285, 663], [450, 567]], kind: 'pulse', from: 8.4, to: 15.3, every: 0.7 } ],
  bi:   [ { pts: [[980, 342], [1102, 428], [1230, 345]], kind: 'light', at: 6.6 } ],
  prod: [ { pts: [[995, 590], [1104, 676], [1325, 543]], kind: 'light', at: 6.75 },
          { pts: [[995, 590], [1104, 676], [1325, 543]], kind: 'pulse', from: 16.4, to: 20.4, every: 0.6 } ],
};
const FLOW_SPEED = 380, BEAD = 26;   // image px per second, bead length
// when each piece is on screen, and how it is revealed
const PIECE_LIFE = {
  core:  [{ tin: 5.0, tout: 7.9, dir: 'up' }],
  trL:   [{ tin: 5.18, tout: 7.85, dir: 'r2l' }],
  trR:   [{ tin: 5.18, tout: 7.85, dir: 'l2r' }],
  pd:    [{ tin: 5.3, tout: 15.6, dir: 'up' }],
  bi:    [{ tin: 5.42, tout: 7.9, dir: 'down' }, { tin: 16.0, tout: 20.6, dir: 'down' }],
  prod:  [{ tin: 5.52, tout: 7.92, dir: 'up' }, { tin: 16.08, tout: 20.64, dir: 'up' }],
};
const PIECE_MOVES = {
  pd:    [{ t: 8.0, to: 's3pd', f: 1.5, shape: 'rect' }, { t: 12.0, to: 's4pd', f: 1.6, shape: 'rect' }],
  bi:    [{ t: 15.9, to: 's5bi', f: 60, shape: 'rect', box: [960, 85, 1345, 684] }],
  prod:  [{ t: 15.9, to: 's5bi', f: 60, shape: 'rect', box: [960, 85, 1345, 684] }],
};

function flowNodes(p, tin, tout, statuses) {
  let h = '';
  const ic = Math.round(CS * 0.42), io = (CS - ic) / 2;
  COLS.forEach((cx, k) => {
    const name = ['pit', 'mill', 'plant', 'port'][k];
    h += `<div class="cell gy" id="${p}c${k}" data-in="${tin + k * 0.05}" data-out="${tout + k * 0.04}" data-f="2.6" style="left:${cx - CS / 2}px;top:${LINE_Y - CS / 2}px;width:${CS}px;height:${CS}px">
      <svg class="bd" width="${CS}" height="${CS}"><rect id="${p}bd${k}" x="1" y="1" width="${CS - 2}" height="${CS - 2}" fill="none" stroke="rgba(201,202,206,.45)" stroke-width="2"/></svg>
      <svg class="ic" id="${p}ic${k}" style="left:${io}px;top:${io}px;width:${ic}px;height:${ic}px" viewBox="0 0 24 24" fill="none" stroke="var(--plat)" stroke-width="1.3">${ICON[name]}</svg></div>`;
    h += `<div class="nm cap" style="left:${cx - 210}px;top:${LINE_Y + CS / 2 + 26}px">${words(NAMES[k].toUpperCase(), tin + 0.12 + k * 0.04, 0.03, tout, 0.01)}</div>`;
    h += `<div class="stl" style="left:${cx - 210}px;top:${LINE_Y + CS / 2 + 74}px">`;
    statuses[k].forEach(s => { h += `<div class="i r full" data-in="${s.tin}"${s.tout != null ? ` data-out="${s.tout}"` : ''} data-f="3">${s.txt}</div>`; });
    h += `</div>`;
  });
  return h;
}

/* ---------- scene markup (screen space at each scene's reference time) ---------- */
function buildScenes() {
  const S = {};
  const line = (id, tin, tout) => `<div class="a gx" id="${id}" data-in="${tin}" data-f="2.6" data-out="${tout}" data-fo="2.6" style="left:${COLS[0]}px;top:${LINE_Y - 1}px;width:${COLS[3] - COLS[0]}px;height:2px;background:rgba(201,202,206,.42);transform-origin:0 50%"></div>`;

  // S1 — cold open: production runs into the mill, the mill fails, everything downstream stops
  const st1 = [
    [{ txt: 'RUNNING', tin: 0.2, tout: 4.7 }],
    [{ txt: 'RUNNING', tin: 0.24, tout: 1.0 }, { txt: 'FAILED', tin: 1.06, tout: 4.72 }],
    [{ txt: 'RUNNING', tin: 0.28, tout: 1.5 }, { txt: 'STOPPED', tin: 1.56, tout: 4.74 }],
    [{ txt: 'SHIPPING', tin: 0.32, tout: 2.0 }, { txt: 'IDLE', tin: 2.06, tout: 4.76 }],
  ];
  S.s1b = line('s1line', 0.0, 4.72);
  S.s1f = `
    <div class="h1" style="left:140px;top:110px">${words('One mill failure.', 1.0, 0.06, 4.6, 0.02)}</div>
    <div class="h1" style="left:140px;top:202px"><span class="m"><span class="i r cu" data-in="2.0" data-out="4.66" data-f="2.4"><em>A cascading loss.</em></span></span></div>
    ${flowNodes('s1', 0.0, 4.7, st1)}
    <div class="imp cl" id="s1imp" data-dir="l" data-in="2.5" data-out="4.6" data-f="2.6" style="left:140px;top:820px;width:1640px;height:150px">
      <div class="ih">${words('Impact — uninsured', 2.56, 0.04, 4.58, 0.01)}</div>
      <div class="row"><span class="iv">${words('Production halted', 3.0, 0.05, 4.58, 0.01)}</span>
        <span class="iv">${words('Fixed costs continue', 3.5, 0.05, 4.6, 0.01)}</span>
        <span class="iv">${words('Payroll continues', 4.0, 0.05, 4.62, 0.01)}</span></div></div>`;

  // S2 — the connected exposures, on the diagram (with motion drawn on it)
  let pcs = '';
  PIECES.forEach(p => {
    const poly = p.poly.map(([x, y]) => `${(x * PS).toFixed(1)}px ${(y * PS).toFixed(1)}px`).join(',');
    let ov = '';
    (FLOWS[p.id] || []).forEach((f, j) => {
      const d = 'M' + f.pts.map(q => q.join(' ')).join(' L');
      const n = f.kind === 'pulse' ? 4 : 1;
      for (let b = 0; b < n; b++)
        ov += `<path id="fl_${p.id}_${j}_${b}" d="${d}" fill="none" stroke="${f.kind === 'pulse' ? '#FFF3E4' : '#FFF0DC'}" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" style="visibility:hidden"/>`;
    });
    pcs += `<div class="piece" id="pc_${p.id}" style="left:${PX}px;top:${PY}px;width:${PW}px;height:${PH}px"><div class="px" id="px_${p.id}" style="background-image:url(${IMG});background-size:${PW}px ${PH}px;clip-path:polygon(${poly})"></div>${ov ? `<svg viewBox="0 0 1408 768" width="${PW}" height="${PH}" style="position:absolute;left:0;top:0;overflow:visible">${ov}</svg>` : ''}</div>`;
  });
  S.s2b = `
    <div class="a cl" id="s2panel" data-dir="c" data-in="5.0" data-out="7.92" data-f="2.2" style="left:${PX}px;top:${PY}px;width:${PW}px;height:${PH}px;background:var(--img);border-radius:6px"></div>
    ${pcs}`;
  S.s2f = `
    ${eyebrow('Connected risks', 1330, 300, 5.3, 7.6)}
    <div class="a" style="left:1330px;top:370px;width:560px;font-size:84px;line-height:1.12">
      ${words('Assets,', 5.6, 0, 7.62)}<br>${words('liability', 6.0, 0, 7.64)}<br>${words('&amp; business', 6.4, 0.08, 7.66, 0.01)}<br>
      <span class="m"><span class="i r cu" data-in="6.6" data-out="7.7"><em>interruption.</em></span></span></div>`;

  // S3 — assets
  S.s3b = anchor('s3pd', 120, 220, 680, 675);
  S.s3f = `
    ${eyebrow('Commercial assets', 900, 230, 8.15, 11.56)}
    <div class="h2" style="left:900px;top:290px;width:960px">${words('Everything the mine', 8.25, 0.05, 11.58, 0.02)}<br>${words('owns and operates.', 8.4, 0.05, 11.6, 0.02, 'em')}</div>
    <div class="body" style="left:900px;top:520px;width:940px;color:var(--plat)">${words('Buildings, fixed plant, contents and stock.', 9.0, 0.06, 11.62, 0.01)}</div>
    <div class="body" style="left:900px;top:700px;width:960px">${words('Insured to', 10.0, 0.06, 11.64, 0.02)} <span id="s3key">${words('reinstatement value,', 10.12, 0.06, 11.66, 0.02, 'cu')}</span><br>
      ${words('not', 10.5, 0, 11.68)} <span style="position:relative;display:inline-block">${words('book value.', 10.56, 0.06, 11.69, 0.02)}
        <i class="a gx" data-in="10.85" data-out="11.62" data-f="2.4" style="left:0;right:0;top:56%;height:3px;background:var(--bone);transform-origin:0 50%"></i></span></div>`;

  // S4 — liability: the boundary moves past the site
  const lia = [
    ['Public liability', 230, 400, 'right', 12.6],
    ["Employers' liability", 1190, 400, 'left', 13.2],
    ['Environmental liability', 230, 610, 'right', 13.8],
    ["Directors' &amp; officers' liability", 1190, 610, 'left', 14.4],
  ];
  let l4 = '';
  lia.forEach(([t, x, y, al, tin], k) => {
    l4 += `<div class="lia" style="left:${x}px;top:${y}px;text-align:${al}">${words(t, tin, 0.06, 15.5 + k * 0.03, 0.01)}</div>`;
  });
  S.s4b = anchor('s4pd', 780, 382, 360, 357);
  S.s4f = `
    <div class="h2" style="left:0;width:1920px;top:120px;text-align:center">${words('Exposure', 12.1, 0.05, 15.48, 0.02)} ${words('follows the operation.', 12.2, 0.05, 15.5, 0.02, 'cu')}</div>
    ${l4}
    <div class="body" style="left:0;width:1920px;top:900px;text-align:center;color:var(--plat)">${words('Well beyond the site boundary.', 15.0, 0.06, 15.56, 0.01)}</div>`;

  // S5 — business interruption, with the conditions stated
  S.s5b = anchor('s5bi', 1340, 166, 480, 747);
  S.s5f = `
    ${eyebrow('Business interruption', 120, 160, 16.12, 20.46)}
    <div class="h2" style="left:120px;top:214px;width:1160px">${words('What happens when', 16.2, 0.05, 20.48, 0.02)}<br>${words('the mine', 16.35, 0.05, 20.5, 0.02)} <span class="m"><span class="i r cu" data-in="16.45" data-out="20.52"><em>stops?</em></span></span></div>
    <div class="body" style="left:120px;top:440px;width:1160px;color:var(--plat)">${words("Asset cover repairs or replaces what's damaged.", 16.9, 0.05, 20.5, 0.01)}</div>
    <div class="body" style="left:120px;top:560px;width:1160px">${words("BI cover can pay lost gross profit and continuing costs while it's rebuilt —", 17.5, 0.05, 20.52, 0.01)}</div>
    <div class="body" style="left:120px;top:740px;width:1160px"><span id="s5lineC">${words("subject to the policy's trigger, terms and indemnity period.", 18.4, 0.06, 20.54, 0.01, 'cu')}</span></div>`;

  // S6 — quantified upfront: the diagram's three steps, set large
  const steps = ['Critical asset ranking', 'Gross profit at risk', 'Indemnity period selection'];
  let s6 = '';
  steps.forEach((txt, k) => {
    const y = 330 + k * 200, tin = 21.0 + k * 0.95;
    s6 += `<div class="box cl" id="s6box${k}" data-dir="c" data-in="${tin}" data-out="23.7" style="left:200px;top:${y}px"><span class="m"><span class="i r" data-in="${tin + 0.05}" data-out="23.68">${k + 1}</span></span></div>`;
    s6 += `<div class="a" style="left:350px;top:${y + 8}px;font-size:72px">${words(txt, tin + 0.08, 0.06, 23.66 + k * 0.02, 0.01)}</div>`;
  });
  S.s6b = ``;
  S.s6f = `
    <div class="h2" style="left:200px;top:140px">${words('Quantified', 21.0, 0.05, 23.62)} ${words('upfront.', 21.06, 0.05, 23.64, 0.02, 'em')}</div>
    ${s6}`;

  // S7 — unless it's covered, with the conditions stated
  const st7 = [[], [{ txt: 'REBUILDING', tin: 24.1, tout: 26.0 }], [], []];
  S.s7b = line('s7line', 24.0, 25.98) +
