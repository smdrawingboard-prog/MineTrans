<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Mine — 60s</title>
<style>
@font-face{font-family:PF;src:url(data:font/woff2;base64,{{PF_N}}) format('woff2');font-weight:400 900;font-style:normal}
@font-face{font-family:PF;src:url(data:font/woff2;base64,{{PF_I}}) format('woff2');font-weight:400 900;font-style:italic}
:root{--onyx:#0A0A0B;--char:#1E1D20;--plat:#C9CACE;--bone:#F7F5F1;--cu:#C9854F;--line:rgba(201,202,206,.16);--img:#2B3337}
html,body{margin:0;padding:0;background:var(--onyx);overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--onyx);
  font-family:PF,serif;color:var(--bone);font-weight:500;-webkit-font-smoothing:antialiased}
#cam,.layer{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.a{position:absolute}
.m{display:inline-block;overflow:hidden;vertical-align:top;padding:.04em .08em .16em;margin:-.04em -.08em -.16em}
.i{display:inline-block}
.mask{overflow:hidden}
.full{position:absolute;left:0;right:0;top:0;text-align:center}
.cap{text-transform:uppercase;letter-spacing:.16em}
.cu{color:var(--cu)}
em{font-style:italic;font-weight:500}
.eb{position:absolute;font-size:18px;letter-spacing:.38em;text-transform:uppercase;color:var(--plat);font-weight:500;white-space:nowrap}
.eb .rule{display:inline-block;width:46px;height:1px;background:rgba(201,202,206,.6);vertical-align:middle;margin-right:22px;transform-origin:0 50%}
.piece{position:absolute;left:210px;top:131px;width:1500px;height:818px;transform-origin:0 0}
.piece .px{position:absolute;inset:0;background-size:1500px 818px}
.cell{position:absolute;width:104px;height:104px;background:var(--onyx);transform-origin:50% 50%}
.cell svg.bd{position:absolute;left:0;top:0;overflow:visible}
.cell svg.ic{position:absolute;left:30px;top:30px;width:44px;height:44px}
.nm{position:absolute;width:360px;text-align:center;font-size:19px;color:var(--plat)}
.stl{position:absolute;width:420px;height:34px;line-height:34px;overflow:hidden;font-size:19px;letter-spacing:.1em;color:rgba(247,245,241,.78)}
.imp{position:absolute;border:1px solid rgba(201,202,206,.32);background:rgba(201,202,206,.035);display:flex;align-items:center;
  gap:44px;padding:0 34px;box-sizing:border-box;border-radius:2px}
.imp .ih{font-size:18px;letter-spacing:.22em;text-transform:uppercase;color:var(--plat)}
.imp .iv{font-size:28px;color:var(--bone)}
.row3{position:absolute;left:880px;width:700px;height:58px;line-height:58px;font-size:32px;padding-left:26px;box-sizing:border-box}
.chip{position:absolute;height:60px;line-height:60px;font-size:25px;padding:0 26px;box-sizing:border-box;border:1px solid rgba(201,202,206,.28);border-radius:2px;white-space:nowrap}
.lia{position:absolute;width:420px}
.lia .t{font-size:32px}
.lia .d{font-size:20px;color:rgba(201,202,206,.85);font-weight:400;margin-top:8px;line-height:1.35}
#cursor{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
#obj{position:absolute}
</style>
</head>
<body>
<div id="stage">
  <svg width="0" height="0" style="position:absolute">
    <filter id="fbObj" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur id="fbObjG" stdDeviation="0 0"/></filter>
    <filter id="fbCur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur id="fbCurG" stdDeviation="0 0"/></filter>
  </svg>
  <div id="cam"></div>
</div>
<script>
/* ============================================================
   MineTrans — "The Mine" explainer, 60s. Every style is a pure function of t.
   Choreography is authored on a 30s clock and played at half speed (K = 2):
   spacing between moments doubles, while springs keep their real-time snap.
   Copy: client/public/insurance-mine.html. Image: images/diagrams/mine-risk-assessment.webp
   ============================================================ */
const BPM = 120, BEAT = 60 / BPM, DUR = 30, K = 2;   // DUR is on the authoring clock; the film runs DUR * K
const IMG = 'data:image/webp;base64,{{IMG}}';
const SCENES = [
  { id: 's1', t0: 0,  t1: 2  },   // hook
  { id: 's2', t0: 2,  t1: 6  },   // the diagram assembles
  { id: 's3', t0: 6,  t1: 10 },   // commercial assets
  { id: 's4', t0: 10, t1: 14 },   // liability
  { id: 's5', t0: 14, t1: 18 },   // business interruption
  { id: 's6', t0: 18, t1: 22 },   // the three steps
  { id: 's7', t0: 22, t1: 27 },   // cascade -> covered (payoff on 24s)
  { id: 's8', t0: 27, t1: 30 },   // end card
];

/* ---------- easing, all functions of time ---------- */
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function spr(x, f = 2.4, z = 0.78) {
  if (x <= 0) return 0;
  x *= K;   // authoring-clock gap -> real seconds
  const w = TAU * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x));
}
function eio(u, k = 5) {
  u = clamp(u, 0, 1);
  const h = x => (Math.exp(k * x) - 1) / (Math.exp(k) - 1);
  return u < 0.5 ? 0.5 * h(2 * u) : 1 - 0.5 * h(2 - 2 * u);
}
const bump = (x, k = 9, w = 13) => x <= 0 ? 0 : Math.exp(-k * x * K) * Math.sin(w * x * K) * 1.9;

/* ---------- markup helpers ---------- */
function words(str, tin, step = 0.06, tout = null, ostep = 0.03, cls = '') {
  return str.split(' ').map((w, i) =>
    `<span class="m"><span class="i r ${cls}" data-in="${(tin + i * step).toFixed(3)}"${tout != null ? ` data-out="${(tout + i * ostep).toFixed(3)}"` : ''}>${w}</span></span>`
  ).join(' ');
}
const eyebrow = (txt, x, y, tin, tout) =>
  `<div class="eb" style="left:${x}px;top:${y}px"><span class="rule gx" data-in="${tin}" data-out="${tout}" data-f="2.4"></span>${words(txt, tin + 0.06, 0.03, tout, 0.01)}</div>`;
const anchor = (id, l, t, w, h) => `<div class="a" id="${id}" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px"></div>`;

const ICON = {
  pit:   '<path d="M3 20h18M6 20V9l6-5 6 5v11"/><path d="M10 20v-5h4v5"/>',
  mill:  '<circle cx="12" cy="12" r="7"/><path d="M12 5v3M12 16v3M5 12h3M16 12h3"/>',
  plant: '<path d="M4 17l5-5 4 4 7-8"/><path d="M20 8v4h-4"/>',
  port:  '<path d="M3 18h13l5-6-5-6H3"/><path d="M3 6v12"/>',
};
const COLS = [435, 785, 1135, 1485], LINE_Y = 600;
const NAMES = ['Pit / Shaft', 'Primary Mill', 'Plant / Process', 'Rail / Port'];

/* ---------- the diagram, cut into pieces (image px; panel is 1500 wide) ---------- */
const PS = 1500 / 1408;
const PIECES = [
  { id: 'trL', poly: [[330, 600], [560, 520], [612, 545], [612, 702], [330, 702]] },
  { id: 'trR', poly: [[830, 545], [940, 450], [940, 375], [1010, 365], [1312, 420], [1312, 565], [1180, 655], [950, 655]] },
  { id: 'core', poly: [[560, 95], [850, 95], [850, 330], [942, 360], [942, 538], [705, 632], [468, 532], [468, 360], [560, 330]] },
  { id: 'pd', poly: [[70, 285], [472, 285], [472, 588], [305, 684], [70, 566]],
              rect: [[70, 285], [472, 285], [472, 684], [305, 684], [70, 684]] },
  { id: 'bi', poly: [[960, 85], [1345, 85], [1345, 396], [1236, 404], [1110, 446], [968, 392]],
              rect: [[960, 85], [1345, 85], [1345, 446], [1345, 446], [1110, 446], [960, 446]] },
  { id: 'prod', poly: [[985, 456], [1180, 440], [1332, 520], [1332, 612], [1150, 684], [988, 606]],
              rect: [[960, 446], [1345, 446], [1345, 446], [1345, 684], [1150, 684], [960, 684]] },
  { id: 'asset', poly: [[70, 68], [478, 68], [478, 274], [70, 274]] },
  { id: 'steps', poly: [[30, 698], [1380, 698], [1380, 760], [30, 760]] },
];
const bboxOf = poly => { const xs = poly.map(p => p[0]), ys = poly.map(p => p[1]); return { l: Math.min(...xs), t: Math.min(...ys), r: Math.max(...xs), b: Math.max(...ys) }; };
// motion drawn on the diagram itself, in image px. 'pulse' = beads travelling a line, 'light' = the line drawn in light once
const FLOWS = {
  trL: [   // property damage -> the MineTrans core
    { pts: [[339, 660], [386, 686], [440, 686], [539, 640], [539, 597], [597, 563]], kind: 'pulse', from: 3.3, to: 5.9, every: 0.5 },
    { pts: [[350, 652], [391, 676], [442, 676], [527, 635], [527, 590], [587, 558]], kind: 'pulse', from: 3.45, to: 5.9, every: 0.5 },
    { pts: [[457, 601], [480, 590], [480, 573], [547, 535]], kind: 'pulse', from: 3.4, to: 5.9, every: 0.42 },
  ],
  core: [  // actuarial, technical, technology — in turn
    { pts: [[571, 212], [705, 292], [839, 212]], kind: 'light', at: 3.62 },
    { pts: [[571, 275], [705, 355], [839, 275]], kind: 'light', at: 3.82 },
    { pts: [[571, 347], [705, 425], [839, 347]], kind: 'light', at: 4.02 },
  ],
  trR: [   // the core -> business interruption and production
    { pts: [[934, 452], [1030, 400]], kind: 'pulse', from: 4.1, to: 5.9, every: 0.32 },
    { pts: [[930, 438], [1022, 390]], kind: 'pulse', from: 4.2, to: 5.9, every: 0.32 },
    { pts: [[850, 532], [890, 560], [890, 628], [920, 650], [1010, 650], [1050, 628]], kind: 'pulse', from: 4.15, to: 5.9, every: 0.45 },
  ],
  pd:   [ { pts: [[84, 540], [285, 663], [450, 567]], kind: 'light', at: 4.3 },
          { pts: [[84, 540], [285, 663], [450, 567]], kind: 'pulse', from: 6.4, to: 13.4, every: 0.7 } ],
  bi:   [ { pts: [[980, 342], [1102, 428], [1230, 345]], kind: 'light', at: 4.45 } ],
  prod: [ { pts: [[995, 590], [1104, 676], [1325, 543]], kind: 'light', at: 4.6 },
          { pts: [[995, 590], [1104, 676], [1325, 543]], kind: 'pulse', from: 14.4, to: 17.5, every: 0.6 } ],
};
const FLOW_SPEED = 330, BEAD = 26;   // image px per authoring second, bead length
// when each piece is on screen, and how it is revealed
const PIECE_LIFE = {
  core:  [{ tin: 2.0, tout: 6.0, dir: 'up' }],
  trL:   [{ tin: 2.22, tout: 5.95, dir: 'r2l' }],
  trR:   [{ tin: 2.22, tout: 5.95, dir: 'l2r' }],
  pd:    [{ tin: 2.5, tout: 13.62, dir: 'up' }],
  bi:    [{ tin: 3.0, tout: 6.0, dir: 'down' }, { tin: 14.0, tout: 17.6, dir: 'down' }],
  prod:  [{ tin: 3.15, tout: 6.02, dir: 'up' }, { tin: 14.08, tout: 17.64, dir: 'up' }],
  asset: [{ tin: 3.5, tout: 6.0, dir: 'l2r' }],
  steps: [{ tin: 4.0, tout: 6.04, dir: 'l2r' }, { tin: 18.0, tout: 21.72, dir: 'l2r' }],
};
// where each piece goes (anchor ids measured in later scenes); 'home' = assembled diagram
const PIECE_MOVES = {
  pd:    [{ t: 6.0, to: 's3pd', f: 1.5, shape: 'rect' }, { t: 10.0, to: 's4pd', f: 1.6, shape: 'rect' }],
  bi:    [{ t: 13.9, to: 's5bi', f: 60, shape: 'rect', box: [960, 85, 1345, 684] }],
  prod:  [{ t: 13.9, to: 's5bi', f: 60, shape: 'rect', box: [960, 85, 1345, 684] }],
  steps: [{ t: 17.9, to: 's6row', f: 60, box: [30, 698, 1380, 760] }],
};

function flowNodes(p, tin, tout, statuses) {
  let h = '';
  COLS.forEach((cx, k) => {
    const ic = ['pit', 'mill', 'plant', 'port'][k];
    h += `<div class="cell gy" id="${p}c${k}" data-in="${tin + k * 0.05}" data-out="${tout + k * 0.04}" data-f="2.6" style="left:${cx - 52}px;top:${LINE_Y - 52}px">
      <svg class="bd" width="104" height="104"><rect id="${p}bd${k}" x=".75" y=".75" width="102.5" height="102.5" fill="none" stroke="rgba(201,202,206,.42)" stroke-width="1.5"/></svg>
      <svg class="ic" id="${p}ic${k}" viewBox="0 0 24 24" fill="none" stroke="var(--plat)" stroke-width="1.3">${ICON[ic]}</svg></div>`;
    h += `<div class="nm cap" style="left:${cx - 180}px;top:${LINE_Y + 72}px">${words(NAMES[k].toUpperCase(), tin + 0.12 + k * 0.04, 0.03, tout, 0.01)}</div>`;
    h += `<div class="stl" style="left:${cx - 210}px;top:${LINE_Y + 108}px">`;
    statuses[k].forEach(s => { h += `<div class="i r full" data-in="${s.tin}"${s.tout != null ? ` data-out="${s.tout}"` : ''} data-f="3">${s.txt}</div>`; });
    h += `</div>`;
  });
  return h;
}

/* ---------- scene markup (screen space at each scene's reference time) ---------- */
function buildScenes() {
  const S = {};
  // S1 — hook
  S.s1b = ``;
  S.s1f = `
    <div class="a" style="left:0;width:1920px;top:440px;text-align:center;font-size:150px;line-height:1.08;letter-spacing:-.015em">
      <span class="m"><span class="i r cu" data-in="0" data-out="1.56"><em>More</em></span></span> ${words('than the', 0.5, 0.07, 1.6, 0.04)}
      <span id="hookWord" style="display:inline-block"><span class="m"><span class="i r" data-in="1.0" data-out="1.66">ground.</span></span></span><span id="hookDotA" style="display:inline-block;width:0;height:0"></span></div>`;

  // S2 — the diagram assembles from its own pieces
  let pcs = '';
  PIECES.forEach(p => {
    const poly = p.poly.map(([x, y]) => `${(x * PS).toFixed(1)}px ${(y * PS).toFixed(1)}px`).join(',');
    let ov = '';
    (FLOWS[p.id] || []).forEach((f, j) => {
      const d = 'M' + f.pts.map(q => q.join(' ')).join(' L');
      const n = f.kind === 'pulse' ? 4 : 1;
      for (let b = 0; b < n; b++)
        ov += `<path id="fl_${p.id}_${j}_${b}" d="${d}" fill="none" stroke="${f.kind === 'pulse' ? '#FFF3E4' : '#FFF0DC'}" stroke-width="${f.kind === 'pulse' ? 4.2 : 4.4}" stroke-linecap="round" stroke-linejoin="round" style="visibility:hidden"/>`;
    });
    pcs += `<div class="piece" id="pc_${p.id}"><div class="px" id="px_${p.id}" style="background-image:url(${IMG});clip-path:polygon(${poly})"></div>${ov ? `<svg viewBox="0 0 1408 768" width="1500" height="818" style="position:absolute;left:0;top:0;overflow:visible">${ov}</svg>` : ''}</div>`;
  });
  S.s2b = `
    <div class="a cl" id="s2panel" data-dir="c" data-in="2.0" data-out="5.96" data-f="2.0" style="left:210px;top:131px;width:1500px;height:818px;background:var(--img);border-radius:6px"></div>
    ${pcs}`;
  S.s2f = `
    <div class="a" style="left:0;width:1920px;top:984px;text-align:center;font-size:27px;color:var(--plat);font-weight:400">${words('Property damage and business interruption exposure run through actuarial, technical and technology layers.', 3.6, 0.018, 4.9, 0.004)}</div>
    <div class="a" id="s2zoom" style="left:${960 - 34}px;top:${540 - 34}px;width:68px;height:68px;border-radius:50%;background:rgba(10,10,11,.72);border:1px solid rgba(201,202,206,.4);box-sizing:border-box;transform-origin:50% 50%">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="var(--bone)" stroke-width="1.6" style="position:absolute;left:20px;top:20px"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg></div>`;

  // S3 — commercial assets
  const items3 = ['Buildings &amp; Fixed Structures', 'Fixed Plant &amp; Infrastructure', 'Contents &amp; Stock', 'All-Risk &amp; Fire Cover'];
  let rows3 = '';
  items3.forEach((txt, k) => {
    rows3 += `<div class="row3" id="s3row${k}" style="top:${492 + k * 66}px"><span class="m"><span class="i r" data-in="${6.5 + k * 0.5}" data-out="${9.6 + k * 0.02}" data-f="3">${txt}</span></span></div>`;
  });
  S.s3b = anchor('s3pd', 230, 262, 566, 562);
  S.s3f = `
    ${eyebrow('Commercial Assets', 880, 246, 6.15, 9.56)}
    <div class="a" style="left:880px;top:290px;width:900px;font-size:64px;line-height:1.1">${words('Everything the mine', 6.25, 0.05, 9.58, 0.02)}<br>${words('owns and operates.', 6.4, 0.05, 9.6, 0.02, 'em')}</div>
    ${rows3}
    <div class="a" style="left:880px;top:790px;width:960px;font-size:33px">
      ${words('Insured to', 8.5, 0.05, 9.64, 0.02)} <span id="s3key">${words('reinstatement value,', 8.6, 0.05, 9.66, 0.02, 'cu')}</span>
      ${words('not', 8.8, 0.05, 9.68)} <span style="position:relative;display:inline-block">${words('book value.', 8.85, 0.05, 9.69, 0.02)}
        <i class="a gx" data-in="9.02" data-out="9.62" data-f="2.4" style="left:0;right:0;top:58%;height:2px;background:var(--bone);transform-origin:0 50%"></i></span></div>`;

  // S4 — liability: the boundary moves past the site
  const lia = [
    ['Public Liability', 'Third-party injury and property damage, including off-site impact.', 330, 400, 'right', 10.5],
    ["Employers' Liability", "Claims by employees beyond statutory workmen's compensation.", 1170, 400, 'left', 11.0],
    ['Environmental Liability', 'Pollution, contamination and rehabilitation exposure.', 330, 640, 'right', 11.5],
    ["Directors' &amp; Officers' Liability", 'Protection for decision-makers against claims.', 1170, 640, 'left', 12.0],
  ];
  let l4 = '';
  lia.forEach(([t, d, x, y, al, tin], k) => {
    l4 += `<div class="lia" style="left:${x}px;top:${y}px;text-align:${al}"><div class="t">${words(t, tin, 0.05, 13.5 + k * 0.03, 0.01)}</div>
      <div class="d">${words(d, tin + 0.14, 0.015, 13.52 + k * 0.03, 0.004)}</div></div>`;
  });
  S.s4b = anchor('s4pd', 790, 430, 340, 338);
  S.s4f = `
    ${eyebrow('Liability', 150, 136, 10.1, 13.46)}
    <div class="a" style="left:150px;top:176px;width:1700px;font-size:58px">${words('Exposure that', 10.15, 0.05, 13.48, 0.02)} ${words('follows the operation,', 10.3, 0.05, 13.5, 0.02, 'cu')} ${words('not the incident.', 10.45, 0.05, 13.52, 0.02)}</div>
    ${l4}
    <div class="a" style="left:0;width:1920px;top:930px;text-align:center;font-size:25px;color:rgba(201,202,206,.85);font-weight:400">${words('Well beyond the site boundary — to the public, to employees, and to the environment.', 12.5, 0.02, 13.54, 0.005)}</div>`;

  // S5 — business interruption
  const chips = [['Gross profit', 180, 15.5], ['Standing charges', 410, 15.75], ['Increased cost of working', 700, 16.0]];
  let c5 = '';
  chips.forEach(([t, x, tin], k) => {
    c5 += `<div class="chip cl" id="s5chip${k}" data-dir="l" data-in="${tin}" data-out="${17.5 + k * 0.03}" data-f="2.8" style="left:${x}px;top:640px"><span class="m"><span class="i r" data-in="${tin + 0.05}" data-out="${17.48 + k * 0.03}" data-f="3">${t}</span></span></div>`;
  });
  S.s5b = anchor('s5bi', 1200, 170, 490, 760);
  S.s5f = `
    ${eyebrow('Business Interruption', 180, 196, 14.12, 17.46)}
    <div class="a" style="left:180px;top:238px;width:1000px;font-size:66px;line-height:1.1">${words('What happens when', 14.2, 0.05, 17.48, 0.02)}<br>${words('the mine', 14.35, 0.05, 17.5, 0.02)} <span class="m"><span class="i r cu" data-in="14.45" data-out="17.52"><em>stops?</em></span></span></div>
    <div class="a" style="left:180px;top:440px;width:1000px;font-size:31px;color:var(--plat);font-weight:400">${words("Asset cover replaces what's damaged.", 14.5, 0.04, 17.5, 0.01)}</div>
    <div class="a" style="left:180px;top:500px;width:1000px;font-size:31px">${words("BI cover replaces what's lost while it's being replaced.", 15.0, 0.04, 17.52, 0.01)}</div>
    ${c5}
    <div class="a" style="left:180px;top:770px;width:1000px;font-size:25px;color:rgba(201,202,206,.85);font-weight:400"><span id="s5line">${words('Quantified upfront in a dedicated BI document — not a claims-time estimate.', 16.5, 0.02, 17.54, 0.005)}</span></div>`;

  // S6 — the diagram's three steps
  const segs = ['Procurement', 'Shipping', 'Installation', 'Commissioning', 'Ramp-up'];
  let sg = '';
  segs.forEach((s, k) => {
    const x0 = 300 + k * 264;
    sg += `<div class="a gy" data-in="0" data-out="21.7" style="left:${x0}px;top:536px;width:1px;height:46px;background:rgba(201,202,206,.4);transform-origin:50% 50%" data-seg="${x0}"></div>`;
