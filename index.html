<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============================================================
         PRIMARY SEO TAGS
         This is an INTERNAL advisor training tool, not a public
         marketing page, so it is set to noindex by default (see
         robots meta below) to protect MineTrans's proprietary
         underwriting methodology. If this ever becomes a public
         thought-leadership asset, remove the noindex line and the
         page is already fully SEO/AI-search-ready.
    ============================================================ -->
    <title>Advanced Mining Insurance Blueprint — MineTrans Training Course</title>
    <meta name="description" content="Interactive internal training course covering MineTrans's 12-step Business Interruption insurance methodology and 18-category mining underwriting questionnaire, for MineTrans advisors and mining finance teams." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://minetrans.co.za/training/" />

    <!-- Open Graph / social preview (kept accurate even while noindexed,
         so internal Slack/WhatsApp/Teams shares render a proper card) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MineTrans Insurance Brokers" />
    <meta property="og:title" content="Advanced Mining Insurance Blueprint — MineTrans Training Course" />
    <meta property="og:description" content="MineTrans's internal Business Interruption methodology and mining underwriting questionnaire, in an interactive training format." />
    <meta property="og:locale" content="en_ZA" />
    <meta name="twitter:card" content="summary" />

    <!-- ============================================================
         STRUCTURED DATA (JSON-LD) — Course schema.
         Left in place even though the page is noindexed: if/when this
         is flipped to a public asset, AI answer engines (ChatGPT,
         Perplexity, Google AI Overviews) and Google's rich results
         can read this immediately with no further work.
    ============================================================ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Course",
      "name": "Advanced Mining Insurance Blueprint",
      "description": "A step-by-step methodology for structuring Business Interruption insurance for mining operations, plus an 18-category underwriting and risk assessment questionnaire.",
      "provider": {
        "@type": "Organization",
        "name": "MineTrans Insurance Brokers",
        "sameAs": "https://minetrans.co.za",
        "description": "MineTrans Insurance Brokers is a Juristic Representative of Donaldson Group (Pty) Ltd — FSP No. 53166."
      },
      "audience": {
        "@type": "Audience",
        "audienceType": "Insurance advisors, mining finance teams"
      },
      "inLanguage": "en-ZA",
      "isAccessibleForFree": false
    }
    </script>

    <!-- Google Fonts — brand typography (Playfair Display / Jost / Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Jost:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
